<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ANGELICA Capture</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 320px;
        margin: 0;
        padding: 12px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      p.hint {
        font-size: 12px;
        color: #555;
        margin-top: 0;
      }
      label {
        display: block;
        font-size: 12px;
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        margin-top: 4px;
        box-sizing: border-box;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      #status {
        font-size: 11px;
        margin-top: 10px;
        color: #333;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <h1>ANGELICA Capture</h1>
    <p class="hint">Send the current tab to your local Second Brain API.</p>
    <label>
      API URL
      <input id="apiUrl" type="text" />
    </label>
    <label>
      Email
      <input id="email" type="text" />
    </label>
    <label>
      Password
      <input id="password" type="password" />
    </label>
    <div class="row">
      <button id="saveBtn" type="button">Save</button>
      <button id="captureBtn" type="button">Capture page</button>
    </div>
    <p id="status"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
